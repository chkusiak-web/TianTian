<title>天天 Jinan Map</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Noto+Sans+SC:wght@400;500;700&family=Pixelify+Sans:wght@400;600&display=swap">
<style>
/* Layout: one game column. HUD strip, pixel canvas, dialogue panel slides over the bottom of the canvas, notebook is a full overlay. Single night-spring look by choice. */
:root{
  --ink:#0d2124; --deep:#15343a; --deeper:#0a1a1c; --line:#2a5359;
  --jade:#46b39d; --spring:#6fd3dd; --paper:#f4ebd3; --paper-ink:#2b2418; --paper-line:#d9cba6;
  --seal:#c9412f; --gold:#eab84b; --lotus:#ec8fab; --mute:#93b7b3; --fg:#e9f2ee;
  --ok:#6cc47a; --bad:#e2735f;
  --f-pixel:"Pixelify Sans", ui-monospace, monospace;
  --f-han:"Atkinson Hyperlegible","Noto Sans SC","PingFang SC","Microsoft YaHei",system-ui,sans-serif;
  color-scheme:dark;
}
html,body{background:var(--ink);color:var(--fg)}
body{font-family:var(--f-han);padding-inline:16px;padding-block:12px 32px}
*{box-sizing:border-box}
[hidden]{display:none!important}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.wrap{max-width:760px;margin:0 auto;display:flex;flex-direction:column;gap:10px}

/* HUD */
.hud{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;font-family:var(--f-pixel)}
.brand{font-family:var(--f-han);font-weight:700;font-size:22px;letter-spacing:.04em;color:var(--spring);display:flex;align-items:baseline;gap:8px}
.brand small{font-family:var(--f-pixel);font-weight:400;font-size:12px;color:var(--mute);letter-spacing:.08em;text-transform:uppercase}
.stats{display:flex;align-items:center;gap:12px;margin-left:auto;flex-wrap:wrap}
.lv{font-size:13px;color:var(--mute)}
.xpbox{display:flex;flex-direction:column;gap:3px;min-width:150px}
.xprow{display:flex;justify-content:space-between;font-size:12px;font-variant-numeric:tabular-nums}
.xprow b{color:var(--gold);font-weight:600}
.bar{height:8px;background:var(--deeper);border:1px solid var(--line);position:relative}
.bar i{position:absolute;inset:0 auto 0 0;background:var(--gold);width:0;transition:width .4s}
.gems{display:flex;align-items:center;gap:5px;font-size:15px;font-variant-numeric:tabular-nums}
.gems svg{width:16px;height:16px}
.btnrow{display:flex;gap:6px;flex-wrap:wrap}
.pbtn{font-family:var(--f-pixel);font-size:13px;background:var(--deep);border:2px solid var(--line);padding:5px 10px;cursor:pointer;box-shadow:0 2px 0 var(--deeper)}
.pbtn:hover{border-color:var(--jade)}
.pbtn:active{transform:translateY(2px);box-shadow:none}
.pbtn.hot{background:var(--seal);border-color:#e5705f}
.pbtn[aria-pressed="true"]{border-color:var(--spring);color:var(--spring)}
.kbd{font-size:10px;color:var(--mute);margin-left:4px}

/* Stage */
.stage{position:relative;border:3px solid var(--line);background:var(--deeper);image-rendering:pixelated}
.scenehead{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap}
.scenehead h1{margin:0;font-size:18px;font-weight:700;text-wrap:balance}
.scenehead h1 span{font-family:var(--f-pixel);font-weight:400;font-size:13px;color:var(--mute);margin-left:8px}
.scenehead p{margin:0;font-family:var(--f-pixel);font-size:12px;color:var(--mute)}
canvas{display:block;width:100%;height:auto;image-rendering:pixelated;image-rendering:crisp-edges}
#game{cursor:pointer}

/* City */
.city{position:relative}
.pin{position:absolute;transform:translate(-50%,-50%);width:30px;height:30px;display:grid;place-items:center;font-family:var(--f-pixel);font-size:14px;cursor:pointer;border:2px solid var(--deeper);background:#5a6b6a;color:#d6dfdd;box-shadow:0 3px 0 var(--deeper)}
.pin.open{background:var(--gold);color:var(--paper-ink);animation:bob 1.4s ease-in-out infinite}
.pin.done{background:var(--seal);color:var(--paper)}
.pin.locked::after{content:"";position:absolute;width:10px;height:8px;right:-6px;top:-6px;background:var(--deeper);border:2px solid #8a9997}
@keyframes bob{50%{transform:translate(-50%,-62%)}}
.dlist{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:6px}
.drow{display:grid;grid-template-columns:28px 1fr auto;align-items:center;gap:8px;padding:7px 9px;background:var(--deep);border:2px solid var(--line);cursor:pointer;text-align:left}
.drow:hover{border-color:var(--jade)}
.drow .n{font-family:var(--f-pixel);color:var(--mute);font-size:14px}
.drow .nm{min-width:0}
.drow .nm b{font-weight:500;font-size:15px}
.drow .nm div{font-size:12px;color:var(--mute);font-family:var(--f-pixel)}
.chip{font-family:var(--f-pixel);font-size:11px;padding:2px 6px;border:1px solid currentColor;white-space:nowrap}
.chip.play{color:var(--gold)} .chip.done{color:var(--lotus)} .chip.lock{color:#7d8f8d}
.mystery{background:var(--deep);border-left:4px solid var(--spring);padding:10px 12px;font-size:14px;line-height:1.55}
.mystery b{color:var(--spring)}

/* Dialogue panel */
.panel{position:relative;margin:2px 3px 6px;display:flex;flex-direction:column;background:var(--paper);color:var(--paper-ink);border:3px solid var(--paper-ink);box-shadow:0 0 0 3px var(--paper),0 6px 0 3px rgba(0,0,0,.35)}
.ptitle{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:6px 10px;background:var(--paper-ink);color:var(--paper);font-family:var(--f-pixel);font-size:13px}
.ptitle .x{background:none;border:0;cursor:pointer;color:var(--paper);font-size:14px;padding:0 4px}
.lines{overflow-y:auto;max-height:min(44vh,360px);padding:8px 12px 4px;display:flex;flex-direction:column;gap:8px;min-height:0}
.line{display:grid;grid-template-columns:auto 1fr;gap:4px 10px;align-items:start}
.line .sp{font-family:var(--f-pixel);font-size:12px;padding-top:12px;color:#6b5b3c;white-space:nowrap}
.line.you .sp{color:var(--seal)}
.line .body{min-width:0}
.line.sys{display:block;font-family:var(--f-pixel);font-size:12px;color:#6b5b3c}
.line.sys.bad{color:var(--seal)}
.line.sys.good{color:#2f7a45}
.paperclue{background:#fffaf0;border:2px dashed var(--paper-line);padding:8px 10px;position:relative}
.paperclue .kind{font-family:var(--f-pixel);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:#8a7650}
.paperclue.flash{animation:flash 1s 2}
@keyframes flash{50%{background:#ffe6a3}}
.zh{font-size:21px;line-height:1.9;word-break:keep-all;overflow-wrap:anywhere}
.zh.sm{font-size:17px;line-height:1.75}
.zh .w{cursor:pointer;border-bottom:1px dotted transparent;border-radius:2px;padding:0 1px}
.zh .w:hover{border-bottom-color:#8a7650;background:rgba(234,184,75,.18)}
.zh .w.name{color:#3a5f8a}
.zh rt{font-size:11px;color:#7a6a48;font-family:var(--f-han);letter-spacing:0}
.nopy .zh rt{display:none}
.hl{background:#ffd96a;box-shadow:0 0 0 2px #ffd96a}
.en{display:flex;gap:8px;align-items:baseline;font-size:13px;color:#6b5b3c}
.en button{font-family:var(--f-pixel);font-size:11px;background:none;border:1px solid #b8a67f;padding:0 5px;cursor:pointer;color:#6b5b3c}
.en span[hidden]{display:none}
.gloss{margin:0 12px;padding:6px 10px;background:var(--paper-ink);color:var(--paper);font-size:14px;display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
.gloss b{font-size:20px;color:var(--gold)}
.gloss i{font-style:normal;color:var(--spring)}
.gloss small{font-family:var(--f-pixel);color:var(--mute);font-size:11px;margin-left:auto}
.choices{display:flex;flex-direction:column;gap:5px;padding:8px 12px 10px}
.choice{display:flex;align-items:center;gap:8px;text-align:left;background:#fffaf0;border:2px solid var(--paper-ink);padding:4px 10px;cursor:pointer;color:var(--paper-ink);box-shadow:0 2px 0 var(--paper-ink)}
.choice:hover:not(:disabled){background:#fff1c9}
.choice:active:not(:disabled){transform:translateY(2px);box-shadow:none}
.choice:disabled{opacity:.5;cursor:default;box-shadow:none;border-style:dashed}
.choice .k{font-family:var(--f-pixel);font-size:11px;color:#8a7650;min-width:12px}
.choice .lbl{flex:1;min-width:0;font-family:var(--f-pixel);font-size:14px}
.choice .zh{font-size:17px;line-height:1.7}
.choice .tag{font-family:var(--f-pixel);font-size:10px;padding:1px 5px;background:var(--gold);color:var(--paper-ink)}
.choice .tag.gem{background:var(--spring)}
.choice.wrong{animation:shake .35s;border-color:var(--seal)}
@keyframes shake{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
.stamp{display:inline-grid;place-items:center;width:84px;height:84px;border:4px solid var(--seal);color:var(--seal);font-weight:700;font-size:20px;line-height:1.1;text-align:center;transform:rotate(-8deg);border-radius:6px;animation:stampin .5s cubic-bezier(.2,1.6,.5,1)}
@keyframes stampin{from{transform:rotate(-8deg) scale(2.2);opacity:0}}

/* Pad */
.pad{display:none;justify-content:space-between;align-items:center;gap:12px;padding-top:4px}
.dpad{display:grid;grid-template-columns:repeat(3,48px);grid-template-rows:repeat(3,44px);gap:3px}
.dpad button,.abtn{background:var(--deep);border:2px solid var(--line);font-family:var(--f-pixel);font-size:16px;touch-action:manipulation;user-select:none;-webkit-user-select:none}
.dpad button:active,.abtn:active{background:var(--line)}
.abtn{width:76px;height:76px;border-radius:50%;font-size:14px;background:var(--seal);border-color:#e5705f}
@media (hover:none),(max-width:600px){.pad{display:flex}.kbd{display:none}}
.talking .pad,.talking .help{display:none!important}
.help{font-family:var(--f-pixel);font-size:12px;color:var(--mute);display:flex;gap:14px;flex-wrap:wrap}
@media (hover:none),(max-width:600px){.help{display:none}}

/* Toasts */
.toasts{position:fixed;top:calc(12px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);display:flex;flex-direction:column;gap:6px;align-items:center;z-index:50;pointer-events:none;width:max-content;max-width:calc(100vw - 32px)}
.toast{font-family:var(--f-pixel);font-size:14px;background:var(--deeper);border:2px solid var(--gold);color:var(--gold);padding:6px 12px;animation:tin .25s ease-out, tout .4s 2.4s forwards;text-align:center}
.toast.gem{border-color:var(--spring);color:var(--spring)}
.toast.q{border-color:var(--lotus);color:var(--fg)}
@keyframes tin{from{transform:translateY(-10px);opacity:0}}
@keyframes tout{to{opacity:0;transform:translateY(-8px)}}

/* Notebook */
.overlay{position:fixed;inset:0;background:rgba(5,14,16,.78);z-index:40;display:grid;place-items:center;padding:16px}
.book{width:min(760px,100%);max-height:calc(100% - 16px);display:flex;flex-direction:column;background:var(--paper);color:var(--paper-ink);border:3px solid var(--paper-ink)}
.tabs{display:flex;flex-wrap:wrap;background:var(--paper-ink)}
.tabs button{font-family:var(--f-pixel);font-size:13px;background:none;border:0;color:var(--paper);padding:8px 12px;cursor:pointer}
.tabs button[aria-selected="true"]{background:var(--paper);color:var(--paper-ink)}
.tabs .x{margin-left:auto}
.bookbody{overflow-y:auto;padding:12px 14px 16px;display:flex;flex-direction:column;gap:10px;min-height:0}
.bookbody h3{margin:6px 0 0;font-family:var(--f-pixel);font-weight:600;font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:#8a7650}
.entry{display:grid;gap:2px;padding:6px 0;border-bottom:1px solid var(--paper-line)}
.entry .src{font-family:var(--f-pixel);font-size:11px;color:#8a7650}
.empty{font-family:var(--f-pixel);color:#8a7650;font-size:13px}
.words{display:flex;flex-wrap:wrap;gap:6px}
.word{border:2px solid var(--paper-ink);padding:4px 8px;background:#fffaf0;display:grid;line-height:1.2}
.word b{font-size:20px;font-weight:500}
.word i{font-style:normal;font-size:12px;color:#7a6a48}
.word span{font-size:12px}
.people{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:8px}
.person{display:flex;gap:10px;align-items:center;border:2px solid var(--paper-ink);padding:6px;background:#fffaf0}
.person canvas{width:40px;height:40px;flex:none}
.person b{font-size:16px;font-weight:500}
.person div div{font-size:12px;color:#7a6a48;font-family:var(--f-pixel)}
.passport{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:10px}
.slot{aspect-ratio:1;max-width:100%;border:2px dashed var(--paper-line);display:grid;place-items:center;text-align:center;font-size:12px;color:#8a7650;font-family:var(--f-pixel);padding:6px}
.slot .stamp{width:78px;height:78px;font-size:17px;animation:none}
.quiz{display:flex;flex-direction:column;gap:8px;align-items:flex-start}
.quiz .big{font-size:44px;font-weight:500;line-height:1.1}
.quiz .opts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px;width:100%;max-width:480px}
.setrow{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-family:var(--f-pixel);font-size:13px}
.danger{background:#fffaf0;border:2px solid var(--seal);color:var(--seal);font-family:var(--f-pixel);padding:4px 10px;cursor:pointer}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<div class="wrap" id="app">
  <header class="hud">
    <div class="brand">天天 <small>Jinan · HSK 1 trial</small></div>
    <div class="stats">
      <span class="lv" id="lv">Lv 1</span>
      <div class="xpbox" title="Every 1,000 XP turns into a Diamond">
        <div class="xprow"><span><b id="xp">0</b> XP</span><span id="nextgem">1,000 to next ◆</span></div>
        <div class="bar"><i id="xpbar"></i></div>
      </div>
      <span class="gems" title="Diamonds: spend one to bribe a character"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M4 2h8l3 4-7 8-7-8z" fill="#6fd3dd"/><path d="M4 2l2 4h4l2-4M1 6h14M6 6l2 8 2-8" fill="none" stroke="#0a1a1c" stroke-width="1"/></svg><b id="gems">1</b></span>
    </div>
  </header>

  <div class="scenehead">
    <h1 id="scenetitle">济南 Jinan</h1>
    <div class="btnrow">
      <button class="pbtn" id="btnPy" aria-pressed="true">拼音</button>
      <button class="pbtn" id="btnBook">Notebook<span class="kbd">N</span></button>
      <button class="pbtn" id="btnMap" hidden>City map<span class="kbd">Esc</span></button>
      <button class="pbtn hot" id="btnSolve" hidden>Solve the case</button>
    </div>
  </div>

  <!-- City scene -->
  <section id="cityScene" class="wrap" style="gap:10px">
    <div class="stage city" id="cityStage"><canvas id="cityCanvas" width="200" height="130"></canvas></div>
    <div class="mystery" id="mystery"></div>
    <div class="dlist" id="dlist"></div>
  </section>

  <!-- District scene -->
  <section id="districtScene" hidden class="wrap" style="gap:8px">
    <div class="stage" id="stage">
      <canvas id="game" width="352" height="224"></canvas>
    </div>
    <div class="panel" id="panel" hidden>
        <div class="ptitle"><span id="ptitle"></span><button class="x" id="pclose" aria-label="Close">✕</button></div>
        <div class="lines" id="lines"></div>
        <div class="gloss" id="gloss" hidden></div>
        <div class="choices" id="choices"></div>
      </div>
    <div class="help"><span>Move: arrows / WASD</span><span>Talk or read: Space</span><span>Answer: 1–4</span><span>Notebook: N</span><span>Map: Esc</span><span>Tap a word to see it</span></div>
    <div class="pad">
      <div class="dpad">
        <span></span><button data-d="up" aria-label="Up">▲</button><span></span>
        <button data-d="left" aria-label="Left">◀</button><span></span><button data-d="right" aria-label="Right">▶</button>
        <span></span><button data-d="down" aria-label="Down">▼</button><span></span>
      </div>
      <button class="abtn" id="abtn">TALK</button>
    </div>
  </section>
</div>
<div class="toasts" id="toasts" aria-live="polite"></div>
<div class="overlay" id="bookOverlay" hidden>
  <div class="book" role="dialog" aria-label="Notebook">
    <div class="tabs" id="tabs"></div>
    <div class="bookbody" id="bookbody"></div>
  </div>
</div>

/* ---------------- Sentence rendering ---------------- */
function toks(zh){return zh.split(' ').filter(Boolean);}
function pyOf(t,next){
  const e=LEX[t];if(!e)return '';
  if(t==='不'&&next&&LEX[next]&&/^[^\s]*?[àèìòùǜ]/.test(LEX[next][0].split(' ')[0]))return 'bú';
  return e[0];
}
function sentEl(zh,opts){
  opts=opts||{};const d=document.createElement('div');d.className='zh'+(opts.sm?' sm':'');
  const ts=toks(zh);
  ts.forEach((t,i)=>{
    if(PUNCT.test(t)||!LEX[t]){d.appendChild(document.createTextNode(t));return;}
    const sp=document.createElement('span');sp.className='w'+(LEX[t][2]==='name'?' name':'');
    const ru=document.createElement('ruby');ru.textContent=t;const rt=document.createElement('rt');rt.textContent=pyOf(t,ts[i+1]);ru.appendChild(rt);sp.appendChild(ru);
    if(!opts.noGloss){sp.addEventListener('click',ev=>{ev.stopPropagation();showGloss(t);});}
    d.appendChild(sp);
  });
  return d;
}
function plain(zh){return toks(zh).join('');}
function enEl(en){
  const d=document.createElement('div');d.className='en';if(!en)return d;
  const b=document.createElement('button');b.textContent='EN';b.type='button';
  const s=document.createElement('span');s.textContent=en;s.hidden=true;
  b.onclick=e=>{e.stopPropagation();s.hidden=!s.hidden;};
  d.append(b,s);return d;
}
function showGloss(t){
  const e=LEX[t];const g=$('gloss');
  const isNew=!S.words[t]&&e[2]!=='name';
  if(e[2]!=='name'){S.words[t]=1;save();}
  g.innerHTML='';const b=document.createElement('b');b.textContent=t;const i=document.createElement('i');i.textContent=e[0];
  const s=document.createElement('span');s.textContent=e[1];const sm=document.createElement('small');sm.textContent=e[2]==='name'?'Name':(isNew?'Saved to Words':'In your Words');
  g.append(b,i,s,sm);g.hidden=false;
  if(bookOpen)renderBook();
}

const TS=16;let C=null,CS=null,MAP=null,W=0,H=0;

const BLOCK=new Set(['T','w','R','~','#','H','h','b','X','D','S']);
function tileAt(x,y){if(y<0||y>=H||x<0||x>=W)return 'T';return MAP[y][x];}
function entities(){
  const e=[];C.npcs.forEach(n=>e.push({type:'npc',x:n.x,y:n.y,o:n}));
  C.clues.forEach(c=>e.push({type:'clue',x:c.x,y:c.y,o:c}));
  e.push({type:'door',x:C.room.door[0],y:C.room.door[1]});
  return e;
}
function entAt(x,y){return entities().find(e=>e.x===x&&e.y===y&&!(e.type==='door'&&CS.roomOpen));}
function blocked(x,y){
  const t=tileAt(x,y);
  if(t==='D')return !CS.roomOpen;
  if(t==='r')return false;
  if(BLOCK.has(t))return true;
  const e=entAt(x,y);return !!e&&e.type!=='door';
}
function hash(x,y){let h=(x*374761393+y*668265263)^0x5bd1e995;h=(h^(h>>>13))*1274126177;return ((h^(h>>>16))>>>0)/4294967295;}
function R(x,y,w,h,c){ctx.fillStyle=c;ctx.fillRect(x,y,w,h);}
function drawTile(t,tx,ty,time){

  switch(t){

   case 'f':grass();[[3,4],[10,9],[6,11]].forEach(([a,b],i)=>{R(x+a,y+b,3,3,i%2?'#ec8fab':'#f6d36b');R(x+a+1,y+b+1,1,1,'#fff6e0');});break;
   case ',':case 'G':R(x,y,TS,TS,'#c9b996');R(x,y+7,TS,1,'#b3a27d');R(x+((ty%2)?4:11),y,1,7,'#b3a27d');R(x+((ty%2)?11:4),y+8,1,8,'#b3a27d');
     if(t==='G'){R(x+1,y,3,TS,'#c9412f');R(x+12,y,3,TS,'#c9412f');R(x,y,TS,3,'#e0a23a');}break;
   case '~':{R(x,y,TS,TS,'#2c8ea3');const p=Math.floor(time/300+tx+ty*2)%4;R(x+p*3,y+4+(tx%2)*5,5,1,'#6fd3dd');R(x+((p+2)%4)*3+2,y+11,4,1,'#4fb7c6');break;}
   case 'T':grass();R(x+1,y+2,14,11,'#1f5a37');R(x+3,y+1,10,2,'#2a6e43');R(x+3,y+4,4,3,'#2f7a46');R(x+7,y+13,2,3,'#5a3d22');break;

  if(C.tigers)C.tigers.forEach((tx,i)=>{const on=!S.solved.heihu;if(!on)return;const px=tx*TS+7;for(let k=0;k<3;k++){const o=Math.floor(time/120+k*3+i)%6;R(px,TS*1+o+k*5-4,2,3,'#d8f6f8');}});

/* ---------------- Movement ---------------- */
const DIRS={up:[0,-1],down:[0,1],left:[-1,0],right:[1,0]};
const held=new Set();let lastStep=0;
function tryStep(d){
  player.dir=d;const [dx,dy]=DIRS[d];const nx=player.x+dx,ny=player.y+dy;
  if(blocked(nx,ny))return false;
  player.from=[player.x,player.y];player.x=nx;player.y=ny;player.t=0;
  if(tileAt(nx,ny)==='G'){setTimeout(()=>{if(player.x===nx&&player.y===ny)goCity();},160);}
  return true;
}
function facing(){const [dx,dy]=DIRS[player.dir];return [player.x+dx,player.y+dy];}
function interact(){
  if(panelOpen()||!C)return;
  const [fx,fy]=facing();let e=entAt(fx,fy);
  if(!e){for(const d in DIRS){const [dx,dy]=DIRS[d];const c=entAt(player.x+dx,player.y+dy);if(c){e=c;player.dir=d;break;}}}
  if(!e){toast('Nothing here. Walk up to someone or something.');return;}
  if(e.type==='npc')talk(e.o);else if(e.type==='clue')readClue(e.o);else door();
}
function bfs(tx,ty,goalAdj){
  const key=(x,y)=>x+','+y;const prev={};const q=[[player.x,player.y]];prev[key(player.x,player.y)]=null;
  while(q.length){const [x,y]=q.shift();
    const ok=goalAdj?(Math.abs(x-tx)+Math.abs(y-ty)===1):(x===tx&&y===ty);
    if(ok){const path=[];let k=key(x,y);while(prev[k]){const [a,b,d]=prev[k];path.unshift(d);k=key(a,b);}return path;}
    for(const d in DIRS){const [dx,dy]=DIRS[d];const nx=x+dx,ny=y+dy;const k=key(nx,ny);if(k in prev)continue;if(blocked(nx,ny))continue;prev[k]=[x,y,d];q.push([nx,ny]);}
  }return null;
}
let tapTarget=null;
cv.addEventListener('click',ev=>{
  if(panelOpen()||!C)return;
  const r=cv.getBoundingClientRect();const tx=Math.floor((ev.clientX-r.left)/r.width*W),ty=Math.floor((ev.clientY-r.top)/r.height*H);
  const e=entAt(tx,ty);
  if(e){if(Math.abs(e.x-player.x)+Math.abs(e.y-player.y)===1){player.dir=Object.keys(DIRS).find(d=>DIRS[d][0]===e.x-player.x&&DIRS[d][1]===e.y-player.y);interact();return;}
    const p=bfs(tx,ty,true);if(p){player.path=p;tapTarget=e;}return;}
  const p=bfs(tx,ty,false);if(p){player.path=p;tapTarget=null;}
});
function loop(time){
  if(C){
    if(player.t<1)player.t=Math.min(1,player.t+0.16);
    else if(!panelOpen()&&!bookOpen){
      if(player.path.length){const d=player.path.shift();if(!tryStep(d))player.path=[];
        else if(!player.path.length&&tapTarget){const e=tapTarget;tapTarget=null;setTimeout(()=>{player.dir=Object.keys(DIRS).find(k=>DIRS[k][0]===e.x-player.x&&DIRS[k][1]===e.y-player.y)||player.dir;interact();},180);}}
      else if(held.size&&time-lastStep>40){const d=[...held].pop();tryStep(d);lastStep=time;}
    }
    render(time);
  }
  requestAnimationFrame(loop);
}
const KEYMAP={ArrowUp:'up',ArrowDown:'down',ArrowLeft:'left',ArrowRight:'right',w:'up',s:'down',a:'left',d:'right',W:'up',S:'down',A:'left',D:'right'};
document.addEventListener('keydown',e=>{
  if(e.target.tagName==='INPUT')return;
  if(bookOpen){if(e.key==='Escape'||e.key==='n'||e.key==='N'){closeBook();e.preventDefault();}return;}
  if(panelOpen()){
    if(/^[1-9]$/.test(e.key)){const b=[...$('choices').querySelectorAll('.choice:not(:disabled)')][+e.key-1];if(b){b.click();e.preventDefault();}return;}
    if(e.key===' '||e.key==='Enter'){const bs=[...$('choices').querySelectorAll('.choice:not(:disabled)')];if(bs.length===1){bs[0].click();e.preventDefault();}else e.preventDefault();return;}
    if(e.key==='Escape'){closePanel();e.preventDefault();}
    return;
  }
  if(e.key==='n'||e.key==='N'){openBook();return;}
  if(!C)return;
  if(KEYMAP[e.key]){held.add(KEYMAP[e.key]);player.path=[];e.preventDefault();}
  else if(e.key===' '||e.key==='Enter'){interact();e.preventDefault();}
  else if(e.key==='Escape'){goCity();}
});
document.addEventListener('keyup',e=>{if(KEYMAP[e.key])held.delete(KEYMAP[e.key]);});
window.addEventListener('blur',()=>held.clear());
document.querySelectorAll('.dpad button').forEach(b=>{

function note(id,src,s){if(S.notes.some(n=>n.id===id))return;S.notes.push({id,c:C.id,src,zh:s.zh,en:s.en});save();}
function ownedChunks(){const o=[...C.startChunks];C.clues.forEach(c=>{if(c.grants&&CS.clues[c.id])o.push(c.grants);});return o;}

/* ---------------- Talk ---------------- */
function npcLabel(n){return n.zh+' · '+n.en;}
function talk(n){
  openPanel(npcLabel(n));
  if(!S.people[n.id]){S.people[n.id]=1;save();}
  if(!CS.met[n.id]){CS.met[n.id]=1;save();sayLine(n.zh,n.intro);note(n.id+':intro',n.zh,n.intro);}
  else sayLine(n.zh,n.ask&&!CS.answered[n.id]?n.intro:n.greet);
  if(n.ask&&!CS.answered[n.id])return askFlow(n);
  menu(n);
}
function askFlow(n){
  sayLine(n.zh,n.ask.q);
  choices(n.ask.opts.map((o,i)=>({zh:o,on:b=>{
    if(i!==n.ask.a){b.classList.remove('wrong');void b.offsetWidth;b.classList.add('wrong');sysLine(n.ask.miss,'bad');return;}
    sayLine('你',Z(o,'My name is Tiantian.'),'you');CS.answered[n.id]=1;addXP(XP_REPLY,'answered in Chinese');
    sayLine(n.zh,n.ask.after);menu(n);
  }})));
}
function menu(n){
  const own=ownedChunks();const list=[];let locked=0;
  for(const k in n.topics){
    if(!own.includes(k)){locked++;continue;}
    const asked=CS.asked[n.id+':'+k];
    list.push({zh:C.chunks[k].zh,tag:asked?null:'+'+XP_ASK+' XP',on:()=>{
      sayLine('你',C.chunks[k],'you');sayLine(n.zh,n.topics[k]);
      if(!asked){CS.asked[n.id+':'+k]=1;note(n.id+':'+k,n.zh,n.topics[k]);addXP(XP_ASK,'asked in Chinese');}
      menu(n);
    }});
  }
  if(locked)list.push({label:'? Find more clues to unlock '+locked+' more question'+(locked>1?'s':''),disabled:true});
  if(!CS.bribed[n.id])list.push({label:'Bribe for one more sentence',tag:'1 ◆',tagCls:'gem',on:()=>bribe(n)});
  list.push({zh:'再见 ！',on:closePanel});
  choices(list);
}
function bribe(n){
  if(S.gems<1){sysLine('You need a Diamond. Every 1,000 XP gives you one.','bad');return;}
  choices([
   {label:'Spend 1 Diamond',tag:'◆ '+S.gems+' → '+(S.gems-1),tagCls:'gem',on:()=>{
     S.gems--;CS.bribed[n.id]=1;save();hud();sysLine(n.en+' leans in…','good');sayLine(n.zh,n.bribe);note(n.id+':bribe',n.zh+' (bribe)',n.bribe);menu(n);}},
   {label:'Keep my Diamond',on:()=>menu(n)}
  ]);
}

/* ---------------- Clues ---------------- */
function readClue(c){
  openPanel(c.kind);
  const p=paperLine(c.kind,c.s);
  if(CS.clues[c.id]){sysLine('Already in your notebook.');choices([{label:'Close',on:closePanel}]);return;}
  sysLine('Check: answer from what you read.');
  sayLine('?',c.check.q);
  choices(c.check.opts.map((o,i)=>({zh:o,on:b=>{
    if(i!==c.check.a){b.classList.remove('wrong');void b.offsetWidth;b.classList.add('wrong');p.classList.remove('flash');void p.offsetWidth;p.classList.add('flash');sysLine('Not quite. Read the note again, the answer is in there.','bad');return;}
    CS.clues[c.id]=1;note(c.id,c.kind,c.s);addXP(XP_CLUE,'clue read');
    sysLine('Right! Saved to your notebook.','good');
    if(c.grants){const q=C.chunks[c.grants];setTimeout(()=>toast('New question: '+plain(q.zh),'q'),350);sysLine('New question unlocked: '+plain(q.zh)+' ('+q.en+')','good');}
    choices([{label:'Close',on:closePanel}]);

function door(){
  const need=C.room.need;
  if(S.xp>=need){CS.roomOpen=true;save();toast(C.room.label+' unlocked with '+need+' XP');return;}
  openPanel(C.room.label);
  sysLine('Locked. You need '+need.toLocaleString()+' XP to get in. You have '+S.xp.toLocaleString()+'.');
  sysLine('Earn XP by reading clues and asking people questions in Chinese.');
  choices([{label:'OK',on:closePanel}]);
}

/* ---------------- Solve ---------------- */
function openSolve(){
  if(!C)return;
  openPanel('Solve: '+C.question);
  if(S.solved[C.id]){finishView(false);return;}
  solveStep();
}
function evidence(q){
  const found=q.ev.filter(id=>CS.clues[id]);
  if(!found.length){sysLine('You haven’t found the sentence for this yet. '+q.hint,'bad');return;}
  sysLine('Look again at '+(found.length>1?'these sentences':'this sentence')+':');
  found.forEach(id=>{const c=C.clues.find(x=>x.id===id);const p=paperLine(c.kind,c.s);p.querySelector('.zh').classList.add('hl');});
}
function solveStep(){
  const q=C.solve[CS.prog];
  sysLine('Question '+(CS.prog+1)+' of '+C.solve.length);
  sayLine('?',q.q);
  const list=q.opts.map((o,i)=>({zh:o,on:b=>{
    if(i!==q.a){CS.firstTry=false;save();b.classList.remove('wrong');void b.offsetWidth;b.classList.add('wrong');evidence(q);return;}
    sayLine('你',Z(o,''),'you');addXP(XP_SOLVEQ,'correct');CS.prog++;save();
    if(CS.prog<C.solve.length)solveStep();else finish();
  }}));
  list.push({label:'Hint (free)',on:()=>{const f=q.ev.filter(id=>CS.clues[id]);if(f.length){sysLine('Hint: the answer is in a sentence you already have.','good');f.forEach(id=>{const c=C.clues.find(x=>x.id===id);const p=paperLine(c.kind,c.s);p.querySelector('.zh').classList.add('hl');});}else sysLine('Hint: '+q.hint,'good');}});
  choices(list);
}
function finish(){
  S.solved[C.id]=true;save();
  addXP(CS.firstTry?XP_FIRST:XP_LATE,CS.firstTry?'solved on first try':'case solved');
  finishView(true);
}
function finishView(fresh){
  const d=document.createElement('div');d.style.cssText='display:flex;gap:16px;align-items:center;flex-wrap:wrap;padding:6px 0';
  const st=document.createElement('div');st.className='stamp';st.textContent=C.zh;
  const t=document.createElement('div');t.style.cssText='flex:1;min-width:200px;font-size:14px;line-height:1.5';
  t.textContent=(fresh?'Case solved! Passport stamp earned. ':'')+C.epilogue.en;
  d.append(st,t);$('lines').appendChild(d);
  sayLine('',C.epilogue.s);
  const nx=C.next?CASES[C.next]:null;
  choices([{label:nx?'Back to the map: '+nx.en+' is open':'Back to the map (Furong Street is next, locked in this trial)',on:()=>{closePanel();goCity();}}]);
}

/* ---------------- Scenes ---------------- */
function enter(id){
  C=CASES[id];CS=S.cases[id];MAP=C.map;W=MAP[0].length;H=MAP.length;
  cv.width=W*TS;cv.height=H*TS;
  player.x=C.spawn[0];player.y=C.spawn[1];player.t=1;player.dir='up';player.path=[];
  $('cityScene').hidden=true;$('districtScene').hidden=false;$('btnMap').hidden=false;$('btnSolve').hidden=false;
  $('scenetitle').innerHTML='';$('scenetitle').append(C.zh+' '+C.en);const sp=document.createElement('span');sp.textContent='Case: '+C.question;$('scenetitle').appendChild(sp);
  closePanel();
  if(!CS.visited){CS.visited=1;save();
    openPanel(C.en+' · HSK 1 · '+C.topic);
    sysLine('Case: '+C.question);
    sysLine('Walk up to people with ! and press Space (or tap them). Sparkles mark clues. When you’re ready, press “Solve the case”.');
    choices([{label:'Start',on:closePanel}]);
  }
}
function goCity(){
  C=null;CS=null;closePanel();
  $('cityScene').hidden=false;$('districtScene').hidden=true;$('btnMap').hidden=true;$('btnSolve').hidden=true;
  $('scenetitle').textContent='济南 Jinan';
  drawCity();renderCity();
}
function unlocked(d){if(!d.id)return false;if(d.id==='baotu')return true;if(d.id==='heihu')return !!S.solved.baotu;return false;}
function renderCity(){
  const st=$('cityStage');st.querySelectorAll('.pin').forEach(p=>p.remove());
  const dl=$('dlist');dl.innerHTML='';
  DISTRICTS.forEach(d=>{
    const ok=unlocked(d),done=d.id&&S.solved[d.id];
    const p=document.createElement('button');p.className='pin '+(done?'done':ok?'open':'locked');p.style.left=d.x+'%';p.style.top=d.y+'%';p.textContent=d.n;p.title=d.en;p.setAttribute('aria-label',d.n+'. '+d.en);
    p.onclick=()=>pick(d);st.appendChild(p);
    const r=document.createElement('button');r.className='drow';r.onclick=()=>pick(d);
    r.innerHTML='<span class="n"></span><span class="nm"><b></b><div></div></span><span class="chip"></span>';
    r.querySelector('.n').textContent=d.n;r.querySelector('b').textContent=d.zh+' '+d.en;r.querySelector('.nm div').textContent='HSK 1 · '+d.topic;
    const ch=r.querySelector('.chip');ch.className='chip '+(done?'done':ok?'play':'lock');ch.textContent=done?'Solved':ok?'Play':'Locked';
    dl.appendChild(r);
  });
  const m=$('mystery');
  const n=Object.keys(S.solved).length;
  m.innerHTML='';const b=document.createElement('b');b.textContent='The city mystery: ';m.append(b,document.createTextNode(
    n===0?'Jinan’s springs are going quiet. Start at Baotu Spring, where Grandma Wang’s cup has gone missing.':
    n===1?'A student named Li Ming is testing the spring water, and he thinks it’s getting low. Follow him to Black Tiger Spring.':
    'The springs stop at 6 o’clock every day, on purpose. A man carrying lots of water headed for Furong Street. That’s where the full game picks up.'));
}
function pick(d){
  if(!d.id){toast(d.en+': locked in this trial (HSK 1 · '+d.topic+')');return;}
  if(!unlocked(d)){toast('Solve Baotu Spring first to open '+d.en);return;}
  enter(d.id);
}
function drawCity(){
  const c=$('cityCanvas'),g=c.getContext('2d');const w=c.width,h=c.height;
  const P=(x,y,ww,hh,col)=>{g.fillStyle=col;g.fillRect(x,y,ww,hh);};
  P(0,0,w,h,'#4f8a58');
  for(let y=0;y<h;y+=2)for(let x=0;x<w;x+=2){const r=hash(x,y);if(r>.93)P(x,y,1,1,'#5f9c64');else if(r<.04)P(x,y,1,1,'#447c4d');}
  // Yellow River
  for(let x=0;x<w;x++){const y=8+Math.round(Math.sin(x/18)*3)+Math.round(x/40);P(x,y,1,7,'#c8a24a');P(x,y+2,1,1,'#ddba62');}
  // city blocks
  for(let i=0;i<120;i++){const x=(hash(i,7)*w)|0,y=22+((hash(i,9)*(h-40))|0);if(Math.hypot(x-w*.55,y-h*.9)<26)continue;P(x,y,3,2,hash(i,3)>.5?'#c7b796':'#a99c80');}
  // roads
  P(0,h*.45,w,1,'#d8cfb6');P(w*.5,20,1,h-30,'#d8cfb6');P(0,h*.7,w,1,'#d8cfb6');P(w*.75,20,1,h-40,'#d8cfb6');
  // railway to station
  for(let x=0;x<w*.4;x+=3)P(x,h*.3,2,1,'#3a3328');P(w*.08,h*.27,12,6,'#8a5a32');
  // Daming Lake
  g.fillStyle='#2c8ea3';g.beginPath();g.ellipse(w*.46,h*.24,18,8,0,0,7);g.fill();P(w*.4,h*.23,6,1,'#6fd3dd');P(w*.48,h*.26,5,1,'#6fd3dd');
  // old city moat
  g.strokeStyle='#2c8ea3';g.lineWidth=2;g.strokeRect(w*.27,h*.33,w*.33,h*.33);
  // springs dots
  [[.31,.49],[.55,.62],[.30,.34]].forEach(([a,b])=>{P(w*a-2,h*b-2,4,4,'#6fd3dd');});
  // Qianfo mountain
  g.fillStyle='#2f6a3f';g.beginPath();g.moveTo(w*.38,h);g.lineTo(w*.55,h*.76);g.lineTo(w*.72,h);g.fill();
  g.fillStyle='#255834';g.beginPath();g.moveTo(w*.48,h);g.lineTo(w*.62,h*.82);g.lineTo(w*.8,h);g.fill();
  // museum
  P(w*.8,h*.57,10,6,'#d9d3c3');P(w*.8,h*.57,10,2,'#c9412f');
}

/* ---------------- Notebook ---------------- */
let bookOpen=false,bookTab='Clues';
const TABS=['Clues','Words','People','Passport','Review','Settings'];
function openBook(t){bookOpen=true;if(t)bookTab=t;$('bookOverlay').hidden=false;held.clear();renderBook();}
function closeBook(){bookOpen=false;$('bookOverlay').hidden=true;}
$('bookOverlay').addEventListener('click',e=>{if(e.target.id==='bookOverlay')closeBook();});
function el(tag,cls,txt){const e=document.createElement(tag);if(cls)e.className=cls;if(txt!=null)e.textContent=txt;return e;}
function renderBook(){
  const tabs=$('tabs');tabs.innerHTML='';
  TABS.forEach(t=>{const b=el('button',null,t);b.setAttribute('role','tab');b.setAttribute('aria-selected',t===bookTab);b.onclick=()=>{bookTab=t;renderBook();};tabs.appendChild(b);});
  const x=el('button','x','✕ Close');x.onclick=closeBook;tabs.appendChild(x);
  const body=$('bookbody');body.innerHTML='';
  if(bookTab==='Clues'){
    if(!S.notes.length)body.appendChild(el('div','empty','Nothing yet. Every clue you read and every answer you hear is saved here with its sentence.'));
    ['baotu','heihu'].forEach(cid=>{
      const ns=S.notes.filter(n=>n.c===cid);if(!ns.length)return;
      body.appendChild(el('h3',null,CASES[cid].zh+' '+CASES[cid].en));
      ns.forEach(n=>{const e=el('div','entry');e.append(el('div','src',n.src),sentEl(n.zh,{sm:true,noGloss:true}),enEl(n.en));body.appendChild(e);});
    });
  }else if(TABS.indexOf(bookTab)===1){
    const ws=Object.keys(S.words);
    body.appendChild(el('div','empty',ws.length?ws.length+' words saved. Tap any word in a sentence to save it.':'Tap any word in a conversation or clue to see its meaning and save it here.'));
    const box=el('div','words');ws.forEach(w=>{const d=el('div','word');d.append(el('b',null,w),el('i',null,LEX[w][0]),el('span',null,LEX[w][1]));box.appendChild(d);});body.appendChild(box);
  }else if(bookTab==='People'){
    const all=[];for(const cid in CASES)CASES[cid].npcs.forEach(n=>{if(S.people[n.id])all.push(n);});
    if(!all.length)body.appendChild(el('div','empty','Talk to someone to add them here.'));
    const box=el('div','people');
    all.forEach(n=>{const d=el('div','person');const c=document.createElement('canvas');c.width=16;c.height=16;drawPerson(c.getContext('2d'),0,0,n.pal,n);c.style.imageRendering='pixelated';
      const t=el('div');t.append(el('b',null,n.zh+' '),el('span',null,n.py));t.appendChild(el('div',null,n.en+' · '+n.role));d.append(c,t);box.appendChild(d);});
    body.appendChild(box);
  }else if(bookTab==='Passport'){
    body.appendChild(el('div','empty','One stamp for each solved case.'));
    const box=el('div','passport');
    DISTRICTS.forEach(d=>{const s=el('div','slot');if(d.id&&S.solved[d.id]){s.appendChild(el('div','stamp',d.zh));}else s.textContent=d.n+'. '+d.en;box.appendChild(s);});
    body.appendChild(box);
  }else if(bookTab==='Review'){renderReview(body);}
  else{
    const r1=el('div','setrow');const pb=el('button','pbtn',S.py?'Pinyin: on':'Pinyin: off');pb.onclick=()=>{S.py=!S.py;save();hud();renderBook();};r1.append(pb);body.appendChild(r1);
    const r2=el('div','setrow');const rb=el('button','danger','Reset all progress');
    rb.onclick=()=>{r2.innerHTML='';r2.append(el('span',null,'Erase XP, Diamonds, clues and stamps?'));const y=el('button','danger','Yes, reset');y.onclick=()=>{S=fresh();save();hud();closeBook();goCity();toast('Progress reset');};const n=el('button','pbtn','Cancel');n.onclick=renderBook;r2.append(y,n);};
    r2.append(rb);body.appendChild(r2);
    body.appendChild(el('div','empty','Trial build: 2 of 10 districts are playable. Progress is saved in this browser only.'));
  }
}
function today(){const d=new Date();return d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate();}
function renderReview(body){
  if(S.review.d!==today()){S.review={d:today(),n:0};save();}
  const ws=Object.keys(S.words);
  body.appendChild(el('div','empty','Review your saved words for +'+XP_REVIEW+' XP each, up to 5 a day. Today: '+S.review.n+'/5.'));
  if(ws.length<2){body.appendChild(el('div','empty','Save at least 2 words first by tapping them in sentences.'));return;}
  const w=ws[(Math.random()*ws.length)|0];
  const pool=Object.keys(LEX).filter(k=>LEX[k][2]!=='name'&&k!==w);
  const opts=[w];while(opts.length<4){const o=pool[(Math.random()*pool.length)|0];if(!opts.includes(o)&&LEX[o][1]!==LEX[w][1])opts.push(o);}
  opts.sort(()=>Math.random()-.5);
  const q=el('div','quiz');const big=el('div','big',w);const py=el('div',null,LEX[w][0]);py.style.color='#7a6a48';
  q.append(el('div','src','What does this mean?'),big,py);
  const grid=el('div','opts');
  opts.forEach(o=>{const b=el('button','choice');b.append(el('span','lbl',LEX[o][1]));b.onclick=()=>{
    if(o!==w){b.classList.remove('wrong');void b.offsetWidth;b.classList.add('wrong');return;}
    if(S.review.n<5){S.review.n++;save();addXP(XP_REVIEW,'review');}else toast('Correct! (daily review XP used up)');
    renderBook();};grid.appendChild(b);});
  q.appendChild(grid);body.appendChild(q);
}

/* ---------------- Wire up ---------------- */
$('btnPy').onclick=()=>{S.py=!S.py;save();hud();};
$('btnBook').onclick=()=>openBook();
$('btnMap').onclick=()=>goCity();
$('btnSolve').onclick=()=>openSolve();
// dev sanity: every token in the data is in the lexicon
(function(){const miss=new Set();const chk=zh=>toks(zh).forEach(t=>{if(!PUNCT.test(t)&&!LEX[t])miss.add(t);});
  for(const id in CASES){const c=CASES[id];Object.values(c.chunks).forEach(s=>chk(s.zh));c.clues.forEach(x=>{chk(x.s.zh);chk(x.check.q.zh);x.check.opts.forEach(chk);});
    c.npcs.forEach(n=>{chk(n.intro.zh);chk(n.greet.zh);chk(n.bribe.zh);Object.values(n.topics).forEach(s=>chk(s.zh));if(n.ask){chk(n.ask.q.zh);chk(n.ask.after.zh);n.ask.opts.forEach(chk);}});
    c.solve.forEach(q=>{chk(q.q.zh);q.opts.forEach(chk);});chk(c.epilogue.s.zh);
    c.map.forEach((r,i)=>{if(r.length!==c.map[0].length)console.warn('map row width',id,i,r.length);});}
  if(miss.size)console.warn('Missing lexicon:',[...miss]);})();
hud();goCity();
requestAnimationFrame(loop);
})();
</script>
